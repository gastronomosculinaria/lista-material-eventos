<!DOCTYPE html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"></head><body>
<title>Gastrônomos: Material de Eventos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita como app de celular; cabeçalho fixo, botões grandes, barra de ação no rodapé. */
:root {
  /* Cores do manual da marca Gastrônomos: terracota #C0615E, verde água #98D8CD, oliva #736F5A, amarelo #F3E197 */
  --bg: #fbf7ee; --surface: #ffffff; --ink: #2b2820; --muted: #66614f; --line: #e8e0cd;
  --terra: #c0615e; --sun: #f3e197; --oliva: #736f5a;
  --wine: #a64e4b; --wine-ink: #ffffff; --wine-soft: #f8e7e4; --mint: #98d8cd; --hero-ink: #ffffff;
  --ok: #2f7a5c; --ok-soft: #e1f3ee; --warn: #8a6100; --warn-soft: #fbf1cf; --bad: #b3261e; --bad-soft: #fbe5e3;
  --info: #3d6f8a; --info-soft: #e3f0f4;
  --display: "Quicksand", "Open Sans", system-ui, sans-serif;
  --body: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1915; --surface: #25221c; --ink: #f3eee2; --muted: #b5ae9a; --line: #3a362c;
  --wine: #e6a29e; --wine-ink: #2b1514; --wine-soft: #3b2724; --mint: #98d8cd; --hero-ink: #ffffff;
  --ok: #7fd6b8; --ok-soft: #1a3029; --warn: #f0cf6a; --warn-soft: #39301a; --bad: #ff8a80; --bad-soft: #3d1d1b;
  --info: #9cc9dd; --info-soft: #1c2c33; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1915; --surface: #25221c; --ink: #f3eee2; --muted: #b5ae9a; --line: #3a362c;
  --wine: #e6a29e; --wine-ink: #2b1514; --wine-soft: #3b2724; --mint: #98d8cd; --hero-ink: #ffffff;
  --ok: #7fd6b8; --ok-soft: #1a3029; --warn: #f0cf6a; --warn-soft: #39301a; --bad: #ff8a80; --bad-soft: #3d1d1b;
  --info: #9cc9dd; --info-soft: #1c2c33; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
a { color: var(--wine) }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 120px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 3px solid var(--terra) }
header.top .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 58px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.top h1 { font-family: var(--display); font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.back { border: 0; background: none; font-size: 26px; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; color: var(--ink) }
.back:hover { background: var(--bg) }
.who { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.2 }
.demo { background: var(--warn-soft); color: var(--warn); font-size: 13px; padding: 8px 12px; border-radius: 10px; margin-bottom: 14px }
h2 { font-family: var(--display); font-size: 22px; margin: 22px 0 10px; text-wrap: balance }
h3 { font-size: 17px; margin: 18px 0 8px }
p.sub { color: var(--muted); margin: 4px 0 14px }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-align: left; cursor: pointer; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px }
.tile:hover { border-color: var(--wine) }
.tile b { font-size: 18px; font-family: var(--display) }
.tile span { color: var(--muted); font-size: 14px }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); background: var(--terra); color: var(--hero-ink); border-radius: 22px; overflow: hidden; min-height: 200px; margin-bottom: 16px }
.hero .lado { padding: 18px 14px 16px 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-width: 0 }
.hero .logo { height: 112px; width: auto; max-width: 100%; object-fit: contain; object-position: left; align-self: flex-start }
.hero .tit { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.25; text-wrap: balance; color: #fff }
.hero .lema { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--sun); margin-top: 4px }
.hero .foto { margin: 12px 12px 12px 0; background: var(--oliva) center / cover no-repeat; border-radius: 58% 42% 52% 48% / 44% 54% 46% 56% }
h1, h2, h3, .tile b, .zona .zh b { font-weight: 700; letter-spacing: -.005em }
.tile .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--wine) }
.tile.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-decoration: none }
.btn.primary { background: var(--wine); color: var(--wine-ink); border-color: var(--wine) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.block { width: 100% }
.btn:disabled { opacity: .5; cursor: default }
.btn:focus-visible, .tile:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible { outline: 3px solid var(--wine); outline-offset: 2px }
.row { display: flex; gap: 10px; flex-wrap: wrap }
.row > * { flex: 1 1 140px }
label.f { display: block; font-weight: 600; margin: 14px 0 6px }
input[type=text], input[type=tel], input[type=number], input[type=password], input[type=date], input[type=time], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface) }
textarea { min-height: 80px }
.hint { font-size: 14px; color: var(--muted) }
.err { background: var(--bad-soft); color: var(--bad); padding: 10px 12px; border-radius: 10px; margin: 12px 0 }
.search { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 4; background: var(--bg); padding-block: 8px; margin-top: -8px }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 4px; scrollbar-width: none }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; white-space: nowrap }
.chip.on { background: var(--wine); color: var(--wine-ink); border-color: var(--wine) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 8px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column }
.card .ph { aspect-ratio: 4 / 3; max-width: 100% }
.card .tx { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.card .nm { font-weight: 600; line-height: 1.25 }
.ph { background: var(--wine-soft); color: var(--wine); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 26px; overflow: hidden; width: 100% }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block }
.qty { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums }
.qty b { color: var(--ink) }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap }
.pill.montando { background: var(--warn-soft); color: var(--warn) }
.pill.em_evento { background: var(--info-soft); color: var(--info) }
.pill.concluido { background: var(--ok-soft); color: var(--ok) }
.pill.falta { background: var(--bad-soft); color: var(--bad) }
.list { display: flex; flex-direction: column; gap: 10px }
.li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: left; width: 100% }
.li .ph { width: 56px; height: 56px; flex: none; border-radius: 10px; font-size: 18px }
.li .mid { flex: 1; min-width: 0 }
.li .mid .nm { font-weight: 600 }
.li.static { cursor: default }
.li.pick { flex-wrap: wrap }
.li.pick .mid { flex: 1 1 150px }
.li.pick .stepper { margin-left: auto }
.stepper { display: flex; align-items: center; gap: 6px; flex: none }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; cursor: pointer }
.stepper input { width: 64px; text-align: center; min-height: 44px; padding: 6px; font-variant-numeric: tabular-nums }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar .in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center }
.bar .in .btn { flex: 1 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.ret { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px }
.ret.short { border-color: var(--bad) }
.ret .top { display: flex; gap: 12px; align-items: center }
.ret .top .ph { width: 56px; height: 56px; border-radius: 10px; font-size: 18px; flex: none }
.logi { border-bottom: 1px solid var(--line); padding: 10px 0; font-size: 14px }
.logi .t { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r) }
.modal { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center }
.modal .sheet { background: var(--surface); width: 100%; max-width: 640px; border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal .sheet .bigph { aspect-ratio: 4 / 3; border-radius: 12px; font-size: 48px; max-width: 100% }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 30; font-weight: 600; max-width: calc(100% - 32px) }
.check { display: flex; gap: 10px; align-items: center; min-height: 48px }
.check input { width: 22px; height: 22px }
.prest { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 8px; margin-bottom: 8px }
.prest button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; cursor: pointer; font-size: 18px }
.loading { text-align: center; color: var(--muted); padding: 40px 0 }
h3.grp { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-size: 18px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--wine) }
h3.grp small { font-family: var(--body); font-weight: 500; font-size: 13px; color: var(--muted) }
h4.sub { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--wine); margin: 14px 0 8px }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px }
.tools .btn { min-height: 40px; padding: 0 14px; font-size: 14px }
.zonas { user-select: none; -webkit-user-select: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; align-items: start }
.zona { background: var(--surface); border: 2px dashed var(--line); border-radius: var(--r); padding: 10px; min-height: 90px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.subz { display: flex; flex-direction: column; gap: 6px; border-radius: 10px; padding: 2px; min-height: 8px }
.subz[data-sub]:not([data-sub=""]) { border: 1px dashed var(--line); padding: 6px; min-height: 40px }
.subz.alvo { outline: 2px solid var(--wine); background: var(--wine-soft) }
.zona.alvo { border-color: var(--wine); background: var(--wine-soft) }
.zona .zh { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; padding: 2px 2px 6px }
.zona .zh b { font-family: var(--display); font-size: 17px }
.arr { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; user-select: none; -webkit-user-select: none; min-width: 0 }
.arr.sel { border-color: var(--wine); background: var(--wine-soft) }
.arr .ph { width: 36px; height: 36px; border-radius: 8px; font-size: 13px; flex: none }
.arr .nm { flex: 1; min-width: 0; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere }
.arr .alca { touch-action: none; cursor: grab; font-size: 20px; color: var(--muted); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex: none; border-radius: 8px }
.arr .alca:hover { background: var(--line) }
.fantasma { position: fixed; z-index: 40; pointer-events: none; opacity: .92; box-shadow: 0 8px 24px rgb(0 0 0 / .25); width: 240px }
#print { display: none }
@media print {
  body > *:not(#print) { display: none !important }
  #print { display: block !important; color: #000; background: #fff; font: 10.5pt/1.3 var(--body) }
  #print h1 { font-family: var(--display); font-size: 15pt; margin: 0 0 2px } #print .info { font-size: 9.5pt; margin-bottom: 8px }
  #print h2 { font-size: 11.5pt; margin: 10px 0 4px; border-bottom: 1px solid #000; padding-bottom: 2px; break-after: avoid }
  #print h3 { font-size: 10pt; margin: 6px 0 2px; text-transform: uppercase; letter-spacing: .04em }
  #print ul { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 18px }
  #print li { break-inside: avoid; padding: 1.5px 0; display: flex; gap: 6px }
  #print li span.q { min-width: 28px; text-align: right; font-weight: 700 } #print li span.v { margin-left: auto; color: #444 }
  #print .ass { margin-top: 14px; font-size: 9.5pt }
  #print .plogo { float: right; height: 58px; margin: 0 0 4px 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact }
  @page { margin: 12mm }
}
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out } @keyframes up { from { opacity: 0; transform: translate(-50%, 8px) } } }
@media (max-width: 380px) { .tiles { grid-template-columns: 1fr } .grid { grid-template-columns: 1fr 1fr } .prest { grid-template-columns: 1fr 44px } .prest input:nth-child(2) { grid-column: 1 } }
</style>

<header class="top"><div class="in" id="hdr"></div></header>
<main class="wrap" id="app"><div class="loading">Carregando…</div></main>
<div id="bar"></div>
<div id="modal"></div>

<script>

(function () {
  var S = { who: null, token: null, data: null, view: 'inicio', p: {}, stack: [], erro: '', grp: 'Todos', q: '' };
  var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  var REMOTO = !IS_GAS && typeof APP_URL === 'string' && APP_URL;
  function remoto(acao, p) {
    var txt = JSON.stringify(p), LIM = 6000;
    function chamar(q) {
      var u = APP_URL + '?' + Object.keys(q).map(function (k) { return k + '=' + encodeURIComponent(q[k]); }).join('&');
      return fetch(u, { credentials: 'omit', redirect: 'follow' }).then(function (r) { return r.json(); })
        .catch(function () { throw new Error('Falha de conexão. Confira a internet e tente de novo.'); })
        .then(function (r) { if (!r || !r.ok) throw new Error(r ? r.erro : 'Sem resposta do servidor.'); return r.data; });
    }
    if (encodeURIComponent(txt).length <= LIM) return chamar({ acao: acao, p: txt });
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10), partes = [], i = 0, n = 0;
    while (i < txt.length) { var t = 5800; while (encodeURIComponent(txt.slice(i, i + t)).length > LIM) t = Math.floor(t * 0.9); partes.push(txt.slice(i, i + t)); i += t; }
    var prox = 0;
    function trabalhador() { var k = prox++; if (k >= partes.length) return null; return chamar({ acao: '_parte', id: id, i: k, d: partes[k] }).then(trabalhador); }
    var fila = []; for (var w = 0; w < 6; w++) fila.push(trabalhador());
    return Promise.all(fila).then(function () { return chamar({ acao: acao, p: 'up:' + id + ':' + partes.length }); });
  }
  var $ = function (id) { return document.getElementById(id); };

  function ls(k, v) {
    try { if (v === undefined) return JSON.parse(localStorage.getItem('inv-buffet-' + k) || 'null'); localStorage.setItem('inv-buffet-' + k, JSON.stringify(v)); } catch (e) { return null; }
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function iniciais(n) { return esc(String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase()); }
  function foto(it) { return it && it.foto ? '<img src="' + esc(it.foto) + '" alt="" loading="lazy">' : iniciais(it && it.nome); }
  function dataBR(d) { if (!d) return 'sem data'; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); return m ? m[3] + '/' + m[2] + '/' + m[1] : d; }
  function quando(iso) { var d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); }
  var STATUS = { montando: 'Separando material', em_evento: 'No evento', concluido: 'Retornado' };

  function api(acao, payload) {
    var p = Object.assign({ token: S.token, who: S.who }, payload || {});
    if (REMOTO) return remoto(acao, p);
    if (IS_GAS) return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (r) { r && r.ok ? res(r.data) : rej(new Error(r ? r.erro : 'Sem resposta do servidor.')); })
        .withFailureHandler(function (e) { rej(new Error(e && e.message ? e.message : 'Falha de conexão. Tente de novo.')); }).api(acao, p);
    });
    return new Promise(function (res, rej) {
      setTimeout(function () { try { res(JSON.parse(JSON.stringify(CORE.handle(DEMO_DB.db, acao, p)))); } catch (e) { rej(e); } }, 120);
    });
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function recarregar() {
    return api('carregar').then(function (d) {
      S.data = d;
      if (S.token && !d.sessao) { S.token = null; ls('token', null); }
    });
  }
  function ir(view, p, semHistorico) {
    if (!semHistorico) S.stack.push({ view: S.view, p: S.p });
    S.view = view; S.p = p || {}; S.erro = '';
    window.scrollTo(0, 0); render();
  }
  function voltar() { var a = S.stack.pop() || { view: 'inicio', p: {} }; S.view = a.view; S.p = a.p; S.erro = ''; render(); }
  function inicio() { S.stack = []; S.view = 'inicio'; S.p = {}; render(); }
  function fazer(btn, promessa, ok) {
    if (btn) btn.disabled = true;
    S.erro = '';
    return promessa.then(function (r) { return recarregar().then(function () { if (ok) ok(r); }); })
      .catch(function (e) { S.erro = e.message; if (btn) btn.disabled = false; mostrarErro(); });
  }
  function mostrarErro() {
    var el = $('erro'); if (el) { el.hidden = !S.erro; el.textContent = S.erro; el.scrollIntoView({ block: 'center' }); }
    else if (S.erro) toast(S.erro);
  }
  function sess() { return S.data && S.data.sessao; }
  function item(id) { return (S.data.itens || []).filter(function (i) { return i.id === id; })[0]; }
  function evento(id) { return (S.data.eventos || []).filter(function (e) { return e.id === id; })[0]; }
  function digitos(s) { return String(s || '').replace(/\D/g, ''); }
  function souPrestador(ev) {
    var t = digitos(S.who && S.who.telefone);
    return t.length >= 8 && ev.prestadores.some(function (p) { var x = digitos(p.telefone); return x.length >= 8 && x.slice(-8) === t.slice(-8); });
  }

  function header(titulo, podeVoltar) {

  function comprimir(file, max) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = function () { rej(new Error('Não consegui abrir essa foto.')); };
      img.src = url;
    });
  }

              d.map(function (i) {
                return '<div class="arr' + (sel[i.id] ? ' sel' : '') + '" data-it="' + i.id + '"><span class="alca" data-alca="' + i.id + '" aria-label="Arrastar">⠿</span><div class="ph">' + foto(i) + '</div><span class="nm">' + esc(i.nome) + '</span></div>';

      Object.keys(sel).forEach(function (k) { sel[k] = false; });
      if (!ids.length) { desenhar(); return; }

      desenhar();
      var dest = g + (sb ? ' / ' + sb : '');
      toast(ids.length === 1 ? 'Movido para ' + dest : ids.length + ' itens movidos para ' + dest);
      api('moverItens', { ids: ids, grupo: g, subgrupo: sb }).catch(function (e) { S.erro = e.message; mostrarErro(); recarregar().then(desenhar); });

      ev.preventDefault();

      var alvo = null, rolar = 0, timer = setInterval(function () { if (rolar) window.scrollBy(0, rolar); }, 16);
      function pos(x, y) {
        f.style.left = (x - 20) + 'px'; f.style.top = (y - 20) + 'px';
        var el = document.elementFromPoint(x, y), z = el && (el.closest('[data-sub]') || el.closest('[data-zona]'));
        if (alvo && alvo !== z) alvo.classList.remove('alvo');
        alvo = z; if (z) z.classList.add('alvo');
        var h = window.innerHeight; rolar = y < 70 ? -12 : y > h - 70 ? 12 : 0;
      }
      pos(ev.clientX, ev.clientY);
      function mv(e) { pos(e.clientX, e.clientY); }
      function up() {
        clearInterval(timer); document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
        f.remove();
        if (alvo) { alvo.classList.remove('alvo'); mover(ids, alvo.dataset.zona, alvo.dataset.sub || ''); }
      }
      document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
    }
    $('gq').oninput = function () { q = S.p.q = this.value; desenhar(); };

        '<label class="f" for="ngn">Nome</label><div class="row"><input type="text" id="ngn" placeholder="Ex.: Caixa de limpeza ou Refrigerantes"><button class="btn primary" id="ngok" style="flex:0 0 auto">Criar</button></div></div>';
      $('ngn').focus();

  V.montar = function () {
    var e = evento(S.p.id);
    header('Separar: ' + e.nome, true);
    var qtd = S.p.qtd || (S.p.qtd = {});
    if (!S.p.ini) { e.linhas.forEach(function (l) { qtd[l.item_id] = l.qtd_saida; }); S.p.ini = true; }
    function livre(i) { return i.disponivel + (e.linhas.filter(function (l) { return l.item_id === i.id; })[0] || { qtd_saida: 0 }).qtd_saida; }
    $('app').innerHTML = busca() + '<p class="hint" style="margin:4px 0 10px">Use + e − ou digite a quantidade separada de cada item.</p><div id="lst" class="list"></div><div id="erro" class="err" hidden></div>';
    function total() {
      var n = 0, p = 0; Object.keys(qtd).forEach(function (k) { if (qtd[k] > 0) { n++; p += qtd[k]; } });
      $('tot').textContent = n + ' itens · ' + p + ' peças';
    }
    function desenhar() {
      var l = filtrar(S.data.itens).sort(function (a, b) { return (qtd[b.id] > 0) - (qtd[a.id] > 0) || a.nome.localeCompare(b.nome); });
      function linhaM(i) {
        return '<div class="li static pick"><div class="ph">' + foto(i) + '</div><div class="mid"><div class="nm">' + esc(i.nome) + '</div><div class="qty">' + livre(i) + ' disponíveis</div></div>' +
          '<div class="stepper"><button type="button" data-m="' + i.id + '" aria-label="Menos">−</button><input type="number" min="0" inputmode="numeric" data-q="' + i.id + '" value="' + (qtd[i.id] || '') + '" placeholder="0" aria-label="Quantidade de ' + esc(i.nome) + '">' +
          '<button type="button" data-p="' + i.id + '" aria-label="Mais">+</button></div></div>';
      }
      $('lst').innerHTML = l.length ? agrupar(l, function (i) { return i.grupo; }).map(function (g) {
        var sep = g[1].filter(function (i) { return qtd[i.id] > 0; }).length;
        return (S.grp === 'Todos' ? cabGrupo(g[0], sep ? sep + ' separados' : null) : '') + porSub(g[0], g[1], function (i) { return i; }, linhaM);
      }).join('') : '<div class="empty">Nenhum item encontrado.</div>';
      function set(id, v) { var max = livre(item(id)); v = Math.max(0, Math.min(max, v || 0)); qtd[id] = v; document.querySelector('[data-q="' + id + '"]').value = v || ''; total(); if (v === max && max > 0) toast('Máximo disponível: ' + max); }
      document.querySelectorAll('[data-m]').forEach(function (b) { b.onclick = function () { set(b.dataset.m, (qtd[b.dataset.m] || 0) - 1); }; });
      document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { set(b.dataset.p, (qtd[b.dataset.p] || 0) + 1); }; });
      document.querySelectorAll('[data-q]').forEach(function (x) { x.onchange = function () { set(x.dataset.q, parseInt(x.value, 10)); }; });
    }
    bar('<span id="tot" class="hint" style="flex:1"></span><button class="btn primary" id="ok">Salvar lista</button>');
    ligarBusca(desenhar); desenhar(); total();
    $('ok').onclick = function () {
      var linhas = Object.keys(qtd).filter(function (k) { return qtd[k] > 0; }).map(function (k) { return { item_id: k, qtd: qtd[k] }; });
      fazer(this, api('salvarListaEvento', { evento_id: e.id, linhas: linhas }), function () { toast('Lista salva'); voltar(); });
    };
  };

  V.retorno = function () {
    var e = evento(S.p.id);
    header('Retorno: ' + e.nome, true);
    var r = S.p.r || (S.p.r = {});
    $('app').innerHTML = '<p class="sub">Conte o que voltou do evento. Se voltou menos do que saiu, explique o motivo.</p>' +
      '<button class="btn block" id="tudo">Voltou tudo certo (preencher tudo)</button><div style="height:12px"></div>' +
      agrupar(e.linhas, function (l) { return grupoDoItem(l.item_id); }).map(function (g) { return cabGrupo(g[0], g[1].length) + porSub(g[0], g[1], itemDaLinha, function (l) {
        var it = item(l.item_id) || { nome: l.nome };
        return '<div class="ret" id="r-' + l.item_id + '"><div class="top"><div class="ph">' + foto(it) + '</div><div class="mid" style="flex:1;min-width:0"><div class="nm" style="font-weight:600">' + esc(it.nome) + '</div><div class="qty">Saiu <b>' + l.qtd_saida + '</b></div></div>' +
          '<div><label class="hint" for="v-' + l.item_id + '">Voltou</label><input type="number" min="0" max="' + l.qtd_saida + '" inputmode="numeric" id="v-' + l.item_id + '" data-v="' + l.item_id + '" style="width:84px;text-align:center"></div></div>' +
          '<div data-j="' + l.item_id + '" hidden><label class="f" style="margin-top:0" for="j-' + l.item_id + '">Por que voltaram menos?</label><textarea id="j-' + l.item_id + '" placeholder="Ex.: 2 taças quebraram durante o serviço"></textarea></div></div>';
      }, '<div class="list">', '</div>'); }).join('') + '<div id="erro" class="err" hidden></div>';
    function upd(id) {
      var l = e.linhas.filter(function (x) { return x.item_id === id; })[0];
      var v = $('v-' + id).value, falta = v !== '' && +v < l.qtd_saida;
      document.querySelector('[data-j="' + id + '"]').hidden = !falta;
      $('r-' + id).classList.toggle('short', falta);
    }
    document.querySelectorAll('[data-v]').forEach(function (x) { x.oninput = function () { upd(x.dataset.v); }; });
    $('tudo').onclick = function () { e.linhas.forEach(function (l) { $('v-' + l.item_id).value = l.qtd_saida; upd(l.item_id); }); };
    bar('<button class="btn primary" id="ok">Enviar retorno</button>');
    $('ok').onclick = function () {
      var linhas = e.linhas.map(function (l) { return { item_id: l.item_id, qtd: $('v-' + l.item_id).value, justificativa: $('j-' + l.item_id).value }; });
      fazer(this, api('registrarRetorno', { evento_id: e.id, linhas: linhas }), function () { toast('Retorno registrado. Obrigado!'); voltar(); });
    };
  };

  V.pessoas = function () {
    header('Equipe e senhas', true);
    bar('<button class="btn primary" id="novo">+ Cadastrar pessoa</button>');
    var ps = S.data.pessoas || [];
    $('app').innerHTML = '<h2>Equipe</h2><p class="sub">Cada pessoa tem uma senha pessoal. Marque quem é da coordenação (acesso total) e quem pode incluir e excluir itens do inventário.</p>' +
      (ps.length ? '<div class="list">' + ps.map(function (p) {
        return '<button class="li" data-p="' + p.id + '"><div class="mid"><div class="nm">' + esc(p.nome) + '</div><div class="hint">' + esc(p.telefone) + '</div></div>' +
          (!p.ativo ? '<span class="pill falta">Bloqueado</span>' : p.coordenador ? '<span class="pill em_evento">Coordenação</span>' : p.pode_inventario ? '<span class="pill concluido">Mexe no inventário</span>' : '<span class="pill montando">Só eventos</span>') + '</button>';
      }).join('') + '</div>' : '<div class="empty">Nenhum estoquista cadastrado.</div>') +
      '<h2>Senha master</h2><p class="sub">Usada pelos coordenadores. Dá acesso total.</p>' +
      '<label class="f" for="nm2">Nova senha master</label><input type="password" id="nm2" autocomplete="new-password">' +
      '<div style="height:10px"></div><button class="btn block" id="tm">Trocar senha master</button><div id="erro" class="err" hidden></div>' +
      (S.data.agenda ? '<h2>Agenda dos eventos</h2><div id="agc"><div class="loading">Lendo agendas…</div></div>' : '');
    document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { ir('pessoaForm', { id: b.dataset.p }); }; });
    $('novo').onclick = function () { ir('pessoaForm', {}); };
    $('tm').onclick = function () { fazer(this, api('trocarMaster', { nova: $('nm2').value }), function () { toast('Senha master trocada'); render(); }); };
    if ($('agc')) api('infoAgenda').then(function (inf) {
      if (!$('agc')) return;
      var tem = inf.agendas.some(function (a) { return a.id === inf.atual; });
      var aviso = inf.acesso ? '<div class="err">A conta <b>' + esc(inf.conta) + '</b> ainda não tem acesso à agenda <b>' + esc(inf.atual) + '</b>. Compartilhe essa agenda com ela, com permissão para fazer alterações nos eventos.</div>'
        : inf.atual ? '<div class="panel" style="color:var(--ok)">Usando a agenda <b>' + esc(inf.atual) + '</b>.</div>' : '';
      $('agc').innerHTML = aviso + '<p class="sub">O app lê e grava eventos na agenda escolhida aqui. Ele funciona pela conta <b>' + esc(inf.conta) + '</b>, então essa conta precisa ter acesso à agenda.</p>' +
        '<label class="f" for="ags">Agendas que essa conta enxerga</label><select id="ags"><option value="">Agenda principal de ' + esc(inf.conta) + '</option>' +
        inf.agendas.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === inf.atual ? ' selected' : '') + '>' + esc(a.nome) + ' (' + esc(a.id) + ')</option>'; }).join('') +
        (inf.atual && !tem ? '<option value="' + esc(inf.atual) + '" selected>' + esc(inf.atual) + '</option>' : '') + '</select>' +
        '<label class="f" for="agi">Ou digite o endereço da agenda</label><input type="text" id="agi" placeholder="ex.: atendimento@suaempresa.com.br" value="' + (inf.atual && !tem ? esc(inf.atual) : '') + '">' +
        '<div style="height:10px"></div><button class="btn block" id="agok">Usar esta agenda</button>';
      $('agok').onclick = function () {
        var id = $('agi').value.trim() || $('ags').value;
        fazer(this, api('definirAgenda', { agenda_id: id }), function () { toast('Agenda escolhida'); render(); });
      };
    }).catch(function (e) { if ($('agc')) $('agc').innerHTML = erroAgenda(e); });
  };

  V.pessoaForm = function () {
    var p = S.p.id ? (S.data.pessoas || []).filter(function (x) { return x.id === S.p.id; })[0] : { nome: '', telefone: '', pode_inventario: false, ativo: true };
    header(S.p.id ? 'Editar pessoa da equipe' : 'Nova pessoa da equipe', true);
    $('app').innerHTML = '<form id="f"><label class="f" for="nm">Nome</label><input type="text" id="nm" value="' + esc(p.nome) + '" required>' +
      '<label class="f" for="tel">Telefone</label><input type="tel" id="tel" value="' + esc(p.telefone) + '">' +
      '<label class="f" for="pw">' + (S.p.id ? 'Nova senha pessoal (deixe vazio para manter)' : 'Senha pessoal') + '</label><input type="text" id="pw" autocomplete="off">' +
      '<label class="check"><input type="checkbox" id="crd"' + (p.coordenador ? ' checked' : '') + '> Coordenação: acesso total, como a senha master</label>' +
      '<label class="check"><input type="checkbox" id="inv"' + (p.pode_inventario ? ' checked' : '') + '> Pode incluir, editar e excluir itens do inventário</label>' +
      '<label class="check"><input type="checkbox" id="atv"' + (p.ativo ? ' checked' : '') + '> Acesso liberado</label><div id="erro" class="err" hidden></div></form>';
    bar('<button class="btn" id="cn">Cancelar</button><button class="btn primary" id="ok">Salvar</button>');
    $('cn').onclick = voltar;
    $('ok').onclick = function () {
      fazer(this, api('salvarPessoa', { pessoa: { id: S.p.id, nome: $('nm').value, telefone: $('tel').value, senha: $('pw').value, pode_inventario: $('inv').checked, coordenador: $('crd').checked, ativo: $('atv').checked } }),
        function () { toast('Salvo'); voltar(); });
    };
  };

  V.historico = function () {
    header('Histórico', true);
    bar('');
    $('app').innerHTML = '<div class="loading">Carregando histórico…</div>';
    api('historico').then(function (h) {
      S.p.h = h;
      $('app').innerHTML = '<input type="text" id="hq" placeholder="Filtrar por nome, telefone, evento…" aria-label="Filtrar histórico"><div id="hl"></div>';
      function des() {
        var q = $('hq').value.toLowerCase();
        var l = h.log.filter(function (x) { return !q || (x.nome + ' ' + x.telefone + ' ' + x.acao + ' ' + x.detalhe).toLowerCase().indexOf(q) >= 0; });
        $('hl').innerHTML = l.length ? l.map(function (x) {
          return '<div class="logi"><div class="t">' + quando(x.em) + ' · ' + esc(x.nome) + ' · ' + esc(x.telefone) + '</div><div><b>' + esc(x.acao) + '</b>' + (x.detalhe ? ' — ' + esc(x.detalhe) : '') + '</div></div>';
        }).join('') : '<div class="empty" style="margin-top:12px">Nada encontrado.</div>';
      }
      $('hq').oninput = des; des();
    }).catch(function (e) { $('app').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  };

  function render() {
    fecharModal();
    if (!S.who) { V.ident(); return; }
    if (!S.data) { $('app').innerHTML = '<div class="loading">Carregando…</div>'; return; }
    (V[S.view] || V.inicio)();
    mostrarErro();
  }

  S.who = ls('who'); S.token = ls('token');
  if (!S.who) { render(); }
  else {
    render();
    api('entrar').catch(function () {}).then(recarregar).then(render).catch(function (e) { $('app').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  }
})();
</script>

</body></html>
