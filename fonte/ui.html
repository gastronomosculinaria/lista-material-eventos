<style>
/* Layout: uma coluna estreita como app de celular; cabeçalho fixo, botões grandes, barra de ação no rodapé. */
:root {

  --info: #9cc9dd; --info-soft: #1c2c33; color-scheme: dark } }

  --ok: #7fd6b8; --ok-soft: #1a3029; --warn: #f0cf6a; --warn-soft: #39301a; --bad: #ff8a80; --bad-soft: #3d1d1b;

  padding: 18px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }

.arr.sel { border-color: var(--wine); background: var(--wine-soft) }

#print { display: none }

  body > *:not(#print) { display: none !important }

  @page { margin: 12mm }
}

@media (max-width: 380px) { .tiles { grid-template-columns: 1fr } .grid { grid-template-columns: 1fr 1fr } }

(function () {
  var S = { who: null, token: null, data: null, view: 'inicio', p: {}, stack: [], erro: '', grp: 'Todos', q: '' };

  // link de cadastro de pessoa nova: ?cadastro=<chave>
  var CAD = (/[?#&]cadastro=([a-z0-9]+)/.exec(location.search + location.hash) || [])[1] || '';

  function novoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function erroRede(m) { var e = new Error(m || 'Sem conexão. Confira a internet e tente de novo.'); e.rede = true; return e; }
  function avisoRede(on) { S.offline = on; var r = document.getElementById('rede'); if (r) r.hidden = !on; }

    return fn().then(function (x) { avisoRede(false); return x; }, function (e) {

      return new Promise(function (ok) { setTimeout(ok, n >= 3 ? 1500 : 4000); }).then(function () { return tentar(fn, n - 1); });
    });

  function remoto(acao, p) {

        return fetch(u, { credentials: 'omit', redirect: 'follow' }).then(function (r) { return r.json(); }).catch(function () { throw erroRede(); });

  var $ = function (id) { return document.getElementById(id); };

  }

  var LIB = 'https://gastronomosculinaria.github.io/lista-material-eventos/lib/';

  function carregarLib(n) {
    if (window[n]) return Promise.resolve(window[n]);
    var urls = LIBS[n].slice();

        var u = urls.shift();

        var sc = document.createElement('script'); sc.src = u;

    if (neg && IS_GAS) return 'A câmera não abre dentro do link do Google. Para ler etiquetas, use o link gastronomosculinaria.github.io/lista-material-eventos';
    if (neg) return 'Permita o uso da câmera para ler as etiquetas (toque no cadeado ao lado do endereço).';

  // Abre a câmera e chama aoLer(código) a cada etiqueta lida; aoLer devolve o texto a mostrar.
  function lerQR(aoLer) {
    $('modal').innerHTML = '<div class="modal" id="mbg"><div class="sheet" role="dialog" aria-label="Ler etiqueta QR"><h2>Ler etiqueta QR</h2>' +
      '<p class="hint">Aponte a câmera para a etiqueta. Cada leitura conta uma unidade.</p><div class="cam"><video id="cv" playsinline muted></video></div>' +
      '<p id="cmsg" class="hint" style="min-height:44px;font-weight:600;color:var(--ink)" aria-live="polite">Abrindo a câmera…</p><button class="btn primary block" id="m-fc">Concluir</button></div></div>';
    var parado = false, stream = null, ultimo = '', quandoLeu = 0;
    pararCam = function () { parado = true; if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); };
    $('m-fc').onclick = fecharModal;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('cmsg').textContent = msgCam(); return; }
    var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
    function detector() {
      if ('BarcodeDetector' in window) {
        try {
          var bd = new BarcodeDetector({ formats: ['qr_code'] });
          return Promise.resolve(function (v) { return bd.detect(v).then(function (c) { return c[0] && c[0].rawValue; }, function () { return null; }); });
        } catch (e) {}
      }
      return carregarLib('jsQR').then(function (jsQR) {
        return function (v) {
          var w = v.videoWidth, h = v.videoHeight; if (!w) return Promise.resolve(null);
          var k = Math.min(1, 640 / Math.max(w, h)); canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
          ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
          var c = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
          return Promise.resolve(c && c.data);
        };
      });
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (st) {
      stream = st; if (parado) { pararCam && pararCam(); return null; }
      var v = $('cv'); v.srcObject = st; return v.play().then(detector);
    }).then(function (det) {
      if (!det || parado) return;
      $('cmsg').textContent = 'Pronto. Aponte para uma etiqueta.';
      (function loop() {
        if (parado || !$('cv')) return;
        det($('cv')).then(function (txt) {
          var t = Date.now();
          if (txt && (txt !== ultimo || t - quandoLeu > 1600)) {
            ultimo = txt; quandoLeu = t;
            var msg = aoLer(txt); if ($('cmsg')) $('cmsg').textContent = msg || '';
            if (navigator.vibrate) navigator.vibrate(60);
          }
          setTimeout(loop, 180);
        });
      })();
    }).catch(function (e) { if ($('cmsg')) $('cmsg').textContent = msgCam(e); });
  }

  function comprimir(file, max) {
    return new Promise(function (res, rej) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { rej(new Error('Não consegui abrir essa foto.')); };
      img.src = url;
    });
  }

      campo('ct', 'Telefone com DDD', 'tel', ' autocomplete="tel" placeholder="(11) 99999-9999"') + campo('cf', 'Função', 'text', ' list="funcoes" placeholder="Ex.: Garçom"') +
      '<datalist id="funcoes">' + FUNCOES.map(function (f) { return '<option value="' + f + '">'; }).join('') + '</datalist>' + campo('cp', 'Chave Pix') +
      '<p class="panel" style="margin-top:16px"><b>Confira os dados preenchidos antes de enviar.</b><br><span class="hint">Este link vale para um envio só. ' + (LK.atualizar ? 'Preencha todos os campos, mesmo os que não mudaram. Os dados novos valem depois que a coordenação aprovar.' : 'Para corrigir algo depois, peça um link novo à Shirlei, à Fabiana ou ao Master.') + '</span></p>' +
      '<div id="erro" class="err" hidden></div><div style="height:8px"></div><button class="btn primary block" id="ok">Enviar cadastro</button></form>';
    $('f').onsubmit = function (e) {
      e.preventDefault();
      var btn = $('ok'), nome = $('cn').value.trim(); btn.disabled = true; S.erro = ''; mostrarErro();
      api('cadastroNovo', { token: null, chave: CAD, pessoa: { nome: nome, rg: $('cr').value, cpf: $('cc').value, telefone: $('ct').value, funcao: $('cf').value, pix: $('cp').value } })
        .then(function (r) { S.p = { link: LK, feito: nome.split(/\s+/)[0], atual: !!(r && r.atualizado) }; window.scrollTo(0, 0); V.cadastro(); })
        .catch(function (err) { S.erro = err.message; btn.disabled = false; mostrarErro(); });
    };
  };

  V.pessoas = function () {
    header('Equipe e senhas', true);
    bar('<button class="btn primary" id="novo">+ Cadastrar pessoa</button>');
    var ps = S.data.pessoas || [];
    $('app').innerHTML = '<h2>Equipe</h2><p class="sub">Cada pessoa tem uma senha pessoal. Marque quem é Master (acesso total), quem cuida do estoque e quem faz a coordenação da equipe (cadastro e escala). Coordenadores (maîtres) não usam senha: são marcados na equipe de cada evento.</p>' +
      (ps.length ? '<div class="list">' + ps.map(function (p) {
        return '<button class="li" data-p="' + p.id + '"><div class="mid"><div class="nm">' + esc(p.nome) + '</div><div class="hint">' + esc(p.telefone) + '</div></div>' +
          (!p.ativo ? '<span class="pill falta">Bloqueado</span>' : p.coordenador ? '<span class="pill em_evento">Master</span>' : '<span class="pill montando">' + [p.estoque ? 'Estoquista' : '', p.escala ? 'Coordenação' : '', !p.estoque && p.separa ? 'separa material' : ''].filter(Boolean).join(' + ') + '</span>') + '</button>';
      }).join('') + '</div>' : '<div class="empty">Nenhum estoquista cadastrado.</div>') +
      '<h2>Senha master</h2><p class="sub">Senha geral do Master. Dá acesso total.</p>' +
      '<label class="f" for="nm2">Nova senha master</label><input type="password" id="nm2" autocomplete="new-password">' +
      '<div style="height:10px"></div><button class="btn block" id="tm">Trocar senha master</button><div id="erro" class="err" hidden></div>' +
      (S.data.agenda ? '<h2>Agenda dos eventos</h2><div id="agc"><div class="loading">Lendo agendas…</div></div>' : '');
    document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { ir('pessoaForm', { id: b.dataset.p }); }; });
    $('novo').onclick = function () { ir('pessoaForm', {}); };
    $('tm').onclick = function () { fazer(this, api('trocarMaster', { nova: $('nm2').value }), function () { toast('Senha master trocada'); render(); }); };
    if ($('agc')) api('infoAgenda').then(function (inf) {
      if (!$('agc')) return;
      var tem = inf.agendas.some(function (a) { return a.id === inf.atual; });
      var aviso = inf.acesso ? '<div class="err">A conta <b>' + esc(inf.conta) + '</b> ainda não tem acesso à agenda <b>' + esc(inf.atual) + '</b>. Compartilhe essa agenda com ela, com permissão para fazer alterações nos eventos.</div>'
        : inf.atual ? '<div class="panel" style="color:var(--ok)">Usando a agenda <b>' + esc(inf.atual) + '</b>.</div>' : '';
      $('agc').innerHTML = aviso + '<p class="sub">O app lê e grava eventos na agenda escolhida aqui. Ele funciona pela conta <b>' + esc(inf.conta) + '</b>, então essa conta precisa ter acesso à agenda.</p>' +
        '<label class="f" for="ags">Agendas que essa conta enxerga</label><select id="ags"><option value="">Agenda principal de ' + esc(inf.conta) + '</option>' +
        inf.agendas.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === inf.atual ? ' selected' : '') + '>' + esc(a.nome) + ' (' + esc(a.id) + ')</option>'; }).join('') +
        (inf.atual && !tem ? '<option value="' + esc(inf.atual) + '" selected>' + esc(inf.atual) + '</option>' : '') + '</select>' +
        '<label class="f" for="agi">Ou digite o endereço da agenda</label><input type="text" id="agi" placeholder="ex.: atendimento@suaempresa.com.br" value="' + (inf.atual && !tem ? esc(inf.atual) : '') + '">' +
        '<div style="height:10px"></div><button class="btn block" id="agok">Usar esta agenda</button>';
      $('agok').onclick = function () {
        var id = $('agi').value.trim() || $('ags').value;
        fazer(this, api('definirAgenda', { agenda_id: id }), function () { toast('Agenda escolhida'); render(); });
      };
    }).catch(function (e) { if ($('agc')) $('agc').innerHTML = erroAgenda(e); });
  };

  V.pessoaForm = function () {
    var p = S.p.id ? (S.data.pessoas || []).filter(function (x) { return x.id === S.p.id; })[0] : { nome: '', telefone: '', pode_inventario: false, ativo: true, estoque: true, escala: false };
    header(S.p.id ? 'Editar pessoa da equipe' : 'Nova pessoa da equipe', true);
    $('app').innerHTML = '<form id="f"><label class="f" for="nm">Nome</label><input type="text" id="nm" value="' + esc(p.nome) + '" required>' +
      '<label class="f" for="tel">Telefone</label><input type="tel" id="tel" value="' + esc(p.telefone) + '">' +
      '<label class="f" for="pw">' + (S.p.id ? 'Nova senha pessoal (deixe vazio para manter)' : 'Senha pessoal') + '</label><input type="text" id="pw" autocomplete="off">' +
      '<label class="check"><input type="checkbox" id="crd"' + (p.coordenador ? ' checked' : '') + '> Master: acesso total e histórico</label>' +
      '<label class="check"><input type="checkbox" id="est"' + (p.estoque ? ' checked' : '') + '> Estoquista: inventário geral, grupos e itens, separação de material e contagem do mês</label>' +
      '<label class="check"><input type="checkbox" id="esk"' + (p.escala ? ' checked' : '') + '> Coordenação da equipe: cadastro completo (RG, CPF, Pix), link de cadastro, bloqueios, equipe dos eventos e envio da escala ao Montador</label>' +
      '<label class="check"><input type="checkbox" id="sep"' + (p.separa ? ' checked' : '') + '> Separar material (autorizado pelo Master): pode montar e fechar listas de material mesmo sem ser estoquista</label>' +
      '<label class="check"><input type="checkbox" id="atv"' + (p.ativo ? ' checked' : '') + '> Acesso liberado</label><div id="erro" class="err" hidden></div></form>';
    bar('<button class="btn" id="cn">Cancelar</button><button class="btn primary" id="ok">Salvar</button>');
    $('cn').onclick = voltar;
    $('ok').onclick = function () {
      fazer(this, api('salvarPessoa', { pessoa: { id: S.p.id, nome: $('nm').value, telefone: $('tel').value, senha: $('pw').value, pode_inventario: $('est').checked, coordenador: $('crd').checked, estoque: $('est').checked, escala: $('esk').checked, separa: $('sep').checked, ativo: $('atv').checked } }),
        function () { toast('Salvo'); voltar(); });
    };
  };

  V.historico = function () {
    header('Histórico', true);
    bar('');
    $('app').innerHTML = '<div class="loading">Carregando histórico…</div>';
    api('historico').then(function (h) {
      S.p.h = h;
      $('app').innerHTML = '<input type="text" id="hq" placeholder="Filtrar por nome, telefone, evento…" aria-label="Filtrar histórico"><div id="hl"></div>';
      function des() {
        var q = $('hq').value.toLowerCase();
        var l = h.log.filter(function (x) { return !q || (x.nome + ' ' + x.telefone + ' ' + x.acao + ' ' + x.detalhe).toLowerCase().indexOf(q) >= 0; });
        $('hl').innerHTML = l.length ? l.map(function (x) {
          return '<div class="logi"><div class="t">' + quando(x.em) + ' · ' + esc(x.nome) + ' · ' + esc(x.telefone) + '</div><div><b>' + esc(x.acao) + '</b>' + (x.detalhe ? ' — ' + esc(x.detalhe) : '') + '</div></div>';
        }).join('') : '<div class="empty" style="margin-top:12px">Nada encontrado.</div>';
      }
      $('hq').oninput = des; des();
    }).catch(function (e) { $('app').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  };

  function render() {
    fecharModal();
    if (CAD) { V.cadastro(); mostrarErro(); return; }
    if (!S.who || !S.token) { (S.view === 'ident' || !LINK ? V.ident : V.convite)(); return; }
    if (!S.data) { $('app').innerHTML = '<div class="loading">Carregando…</div>'; return; }
    (V[S.view] || V.inicio)();
    mostrarErro();
  }

  // sem conexão: tenta de novo a cada 20 s (e quando o celular avisa que voltou a internet)
  function religar() {
    if (!S.offline || !S.token || S.religando) return;
    S.religando = true;
    recarregar().then(function () { S.religando = false; if (['inicio', 'inventario', 'eventos', 'evento'].indexOf(S.view) >= 0 && !$('modal').innerHTML) render(); })
      .catch(function () { S.religando = false; });
  }
  setInterval(religar, 20000);
  window.addEventListener('online', religar);

  S.who = ls('who'); S.token = ls('token');
  if (CAD) { S.p = {}; render(); return; }
  // link de outro evento: quem não é da equipe confirma o nome de novo
  if (LINK && ls('convE') && ls('convE') !== LINK) { S.token = null; ls('token', null); ls('dados', null); }
  if (!S.who || !S.token) { render(); }
  else {
    // mostra na hora os últimos dados guardados no aparelho e atualiza em seguida
    var guardados = ls('dados'); if (guardados && guardados.itens) S.data = guardados;
    render();
    recarregar().then(function () {
      if (LINK && S.token && sess()) { S.stack = [{ view: 'inicio', p: {} }]; S.view = 'evento'; S.p = { id: LINK.split('.')[0] }; }
      render();
    }).catch(function (e) {
      if (S.data) { avisoRede(true); render(); } else $('app').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }
})();
</script>
